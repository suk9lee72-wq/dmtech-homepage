<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>DMTech</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:#020817;
  color:white;
  overflow-x:hidden;
}

/* HEADER */

header{
  width:100%;
  position:sticky;
  top:0;
  z-index:9999;
  background:#020817;
  border-bottom:1px solid rgba(255,255,255,0.06);
}

.header-inner{
  max-width:1400px;
  margin:0 auto;
  padding:14px 28px;
}

/* TOP */

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

/* LOGO */

.logo-image img{
  height:38px;
  width:auto;
  display:block;
}

/* MENU */

.menu{
  display:flex;
  gap:34px;
  align-items:center;
}

.menu a{
  color:white;
  text-decoration:none;
  font-size:15px;
  font-weight:600;
  opacity:0.9;
}

/* SEARCH */

.search-wrap{
  margin-top:18px;
}

.search-box{
  width:100%;
  height:58px;
  border-radius:16px;
  background:white;
  display:flex;
  align-items:center;
  padding:0 18px;
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:18px;
}

/* HERO */

.hero{
  width:100%;
  background:
  radial-gradient(circle at top right,#18314d 0%,#020817 35%);
  padding:34px 0 24px;
}

.hero-inner{
  max-width:1400px;
  margin:0 auto;
  padding:0 28px;
}

.parts-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.parts-title{
  font-size:54px;
  font-weight:900;
  letter-spacing:-2px;
}

.parts-count{
  font-size:26px;
  opacity:0.8;
}

/* FILTERS */

.filters{
  display:flex;
  gap:16px;
  flex-wrap:wrap;
}

.filter-select{
  width:220px;
  height:52px;
  border-radius:14px;
  border:none;
  background:#10213b;
  color:white;
  padding:0 14px;
  font-size:15px;
}

/* PRODUCTS */

.products{
  max-width:1400px;
  margin:0 auto;
  padding:24px 28px 80px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:26px;
}

.product-card{
  background:#081225;
  border-radius:22px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.06);
}

.product-image{
  height:320px;
  background:#f2f2f2;
}

.product-info{
  padding:28px;
}

.product-title{
  font-size:32px;
  font-weight:800;
  margin-bottom:14px;
}

.product-info p{
  font-size:20px;
  margin-bottom:8px;
}

.quote-btn{
  margin-top:18px;
  border:none;
  background:#43b4ff;
  color:black;
  padding:16px 28px;
  border-radius:14px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
}

/* FOOTER */

footer{
  width:100%;
  background:#020617;
  border-top:1px solid rgba(255,255,255,0.05);
  padding:28px;
  text-align:center;
  color:rgba(255,255,255,0.7);
  font-size:14px;
}

/* MOBILE */

@media(max-width:768px){

  .header-inner{
    padding:12px 22px 14px;
  }

  .logo-image img{
    height:28px;
  }

  .menu{
    gap:16px;
  }

  .menu a{
    font-size:12px;
  }

  .search-box{
    height:48px;
  }

  .search-box input{
    font-size:15px;
  }

  .hero{
    padding:18px 0 12px;
  }

  .hero-inner{
    padding:0 22px;
  }

  .parts-title{
    font-size:32px;
  }

  .parts-count{
    font-size:18px;
  }

  .filters{
    gap:10px;
  }

  .filter-select{
    width:100%;
    height:46px;
  }

  .products{
    padding:18px 22px 70px;
  }

  .products-grid{
    grid-template-columns:1fr;
  }

  .product-image{
    height:240px;
  }

  .product-title{
    font-size:24px;
  }

  .product-info p{
    font-size:17px;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="header-top">

      <!-- LOGO -->
      <div class="logo-image">
        <img src="/logo.png" alt="DMTech Logo">
      </div>

      <!-- MENU -->
      <nav class="menu">
        <a href="#">Products</a>
        <a href="#">Repair</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>

    </div>

    <!-- SEARCH -->
    <div class="search-wrap">

      <div class="search-box">

        <input
          type="text"
          placeholder="Request Quote Part Number..."
        >

      </div>

    </div>

  </div>

</header>

<!-- HERO -->

<section class="hero">

  <div class="hero-inner">

    <div class="parts-row">

      <div class="parts-title">
        ESC Parts
      </div>

      <div class="parts-count">
        482 Parts
      </div>

    </div>

    <!-- FILTERS -->

    <div class="filters">

      <select class="filter-select">
        <option>Manufacturer</option>
      </select>

      <select class="filter-select">
        <option>Source Type</option>
      </select>

      <select class="filter-select">
        <option>Condition</option>
      </select>

    </div>

  </div>

</section>

<!-- PRODUCTS -->

<section class="products">

  <div class="products-grid">

    <div class="product-card">

      <div class="product-image"></div>

      <div class="product-info">

        <div class="product-title">
          ESC Chuck
        </div>

        <p><strong>OEM:</strong> TEL</p>
        <p><strong>Condition:</strong> USED</p>

        <button class="quote-btn">
          Request Quote
        </button>

      </div>

    </div>

    <div class="product-card">

      <div class="product-image"></div>

      <div class="product-info">

        <div class="product-title">
          0010-16392
        </div>

        <p><strong>OEM:</strong> AMAT</p>
        <p><strong>Condition:</strong> Refurbished</p>

        <button class="quote-btn">
          Request Quote
        </button>

      </div>

    </div>

  </div>

</section>

<footer>
  © 2026 DMTech Semiconductor Parts Supply
</footer>

</body>
</html>
