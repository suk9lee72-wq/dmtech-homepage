<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DMTech</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#020817;
      color:white;
      overflow-x:hidden;
    }

    .page-wrapper{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:
      radial-gradient(circle at top right,#12304d 0%,#020817 35%);
    }

    .header{
      width:100%;
      background:#020617;
      border-bottom:1px solid rgba(255,255,255,0.05);
      position:sticky;
      top:0;
      z-index:9999;
    }

    .header-inner{
      max-width:1280px;
      margin:0 auto;
      padding:14px 28px;
    }

    .header-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo-image img{
      height:38px;
      width:auto;
      display:block;
      cursor:pointer;
    }

    .menu{
      display:flex;
      gap:42px;
      align-items:center;
    }

    .menu a{
      color:white;
      text-decoration:none;
      font-size:17px;
      font-weight:600;
      opacity:0.9;
    }

    .home-icon-btn{
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .search-wrap{
      margin-top:18px;
    }

    .search-box{
      width:100%;
      height:58px;
      border-radius:16px;
      background:white;
      display:flex;
      align-items:center;
      padding:0 18px;
    }

    .search-box input{
      flex:1;
      border:none;
      outline:none;
      font-size:20px;
    }

    .hero-section{
      width:100%;
      padding-top:30px;
      padding-bottom:20px;
      background:
      linear-gradient(to right,#08142d 0%,#102844 50%,#08142d 100%);
    }

    .hero-inner{
      max-width:1280px;
      margin:0 auto;
      padding:0 28px;
    }

    .parts-title-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:18px;
    }

    .parts-title{
      font-size:58px;
      font-weight:900;
      letter-spacing:-2px;
    }

    .parts-count{
      font-size:28px;
      opacity:0.8;
    }

    .filters{
      display:flex;
      gap:18px;
      margin-bottom:24px;
      flex-wrap:wrap;
    }

    .filter-select{
      width:220px;
      height:54px;
      border-radius:14px;
      background:#1b2942;
      border:1px solid rgba(255,255,255,0.1);
      color:white;
      padding:0 16px;
      font-size:16px;
    }

    .products-section{
      flex:1;
      width:100%;
      background:
      radial-gradient(circle at top right,#12304d 0%,#020817 35%);
      padding-bottom:80px;
    }

    .products-inner{
      max-width:1280px;
      margin:0 auto;
      padding:30px 28px 0;
    }

    .products-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:26px;
    }

    .product-card{
      background:#020b25;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,0.08);
    }

    .product-image{
      background:#efefef;
      height:320px;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .product-image img{
      width:72%;
      object-fit:contain;
    }

    .product-info{
      padding:28px;
    }

    .product-title{
      font-size:34px;
      font-weight:800;
      margin-bottom:16px;
    }

    .product-info p{
      font-size:22px;
      margin-bottom:8px;
    }

    .quote-btn{
      margin-top:18px;
      border:none;
      background:#43b4ff;
      color:black;
      padding:16px 28px;
      border-radius:16px;
      font-size:18px;
      font-weight:700;
      cursor:pointer;
    }

    .footer{
      width:100%;
      background:#020617;
      border-top:1px solid rgba(255,255,255,0.05);
      padding:28px;
      text-align:center;
      font-size:15px;
      opacity:0.7;
    }

    @media(max-width:768px){

      .header-inner{
        padding:12px 14px;
      }

      .logo-image img{
        height:28px;
      }

      .menu{
        gap:18px;
      }

      .menu a{
        font-size:13px;
      }

      .search-box{
        height:48px;
      }

      .search-box input{
        font-size:16px;
      }

      .hero-section{
        padding-top:14px;
      }

      .hero-inner{
        padding:0 14px;
      }

      .parts-title{
        font-size:30px;
      }

      .parts-count{
        font-size:18px;
      }

      .filters{
        gap:10px;
        margin-bottom:10px;
      }

      .filter-select{
        width:100%;
        height:46px;
      }

      .products-inner{
        padding:18px 14px 0;
      }

      .products-grid{
        grid-template-columns:1fr;
      }

      .product-image{
        height:240px;
      }

      .product-title{
        font-size:26px;
      }

      .product-info p{
        font-size:18px;
      }

    }

  </style>
</head>

<body>

<div class="page-wrapper">

  <header class="header">

    <div class="header-inner">

      <div class="header-top">

        <div class="logo-image" onclick="location.reload()">
          <img src="./public/logo.png" alt="DMTech Logo">
        </div>

        <nav class="menu">
          <a href="#">Products</a>
          <a href="#">Repair</a>
          <a href="#">About</a>
          <a href="#">Contact</a>
        </nav>

        <a href="#" class="home-icon-btn">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5L12 3L21 10.5"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
            <path d="M5 9.5V20H19V9.5"
              stroke="white"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>
        </a>

      </div>

      <div class="search-wrap">

        <div class="search-box">

          <input
            type="text"
            placeholder="Request Quote Part Number..."
          >

          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7"
              stroke="#111"
              stroke-width="2"/>
            <path d="M20 20L17 17"
              stroke="#111"
              stroke-width="2"
              stroke-linecap="round"/>
          </svg>

        </div>

      </div>

    </div>

  </header>

  <section class="hero-section">

    <div class="hero-inner">

      <div class="parts-title-row">

        <div class="parts-title">
          ESC Parts
        </div>

        <div class="parts-count">
          482 Parts
        </div>

      </div>

      <div class="filters">

        <select class="filter-select">
          <option>Manufacturer</option>
        </select>

        <select class="filter-select">
          <option>Source Type</option>
        </select>

        <select class="filter-select">
          <option>Condition</option>
        </select>

      </div>

    </div>

  </section>

  <section class="products-section">

    <div class="products-inner">

      <div class="products-grid">

        <div class="product-card">

          <div class="product-image">
            <img src="./public/esc.png">
          </div>

          <div class="product-info">

            <div class="product-title">
              ESC Chuck
            </div>

            <p><strong>OEM:</strong> TEL</p>
            <p><strong>Condition:</strong> USED</p>

            <button class="quote-btn">
              Request Quote
            </button>

          </div>

        </div>

        <div class="product-card">

          <div class="product-image">
            <img src="./public/esc.png">
          </div>

          <div class="product-info">

            <div class="product-title">
              0010-16392
            </div>

            <p><strong>OEM:</strong> AMAT</p>
            <p><strong>Condition:</strong> Refurbished</p>

            <button class="quote-btn">
              Request Quote
            </button>

          </div>

        </div>

      </div>

    </div>

  </section>

  <footer class="footer">
    © 2026 DMTech Semiconductor Parts Supply
  </footer>

</div>

</body>
</html>
